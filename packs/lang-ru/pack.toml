[pack]
id = "lang-ru"
kind = "lang"
version = "0.1.0"
api_version = 1
scripts = ["Cyrillic"]
license = "Apache-2.0"
description = "Русский: общие слова, слова контекста и ключей конфигов. Имена, отчества, фамилии и их склонение."

[lexicon]
inflections = ["ы", "и", "а", "я", "ов", "ев", "ей", "ам", "ям", "ах", "ях", "ой", "ый", "ий", "ая", "ое", "ые"]

[context]
PERSON = [
    "сотрудник", "сотрудница", "коллега", "менеджер", "руководитель", "начальник", "директор", "фио", "ответственный",
    "исполнитель", "автор", "написал", "написала", "сказал", "сказала", "звонил", "звонила", "попросил", "попросила",
    "спроси", "спросить", "передай", "передать", "контакт", "заказчик", "уважаемый", "уважаемая", "здравствуйте",
    "привет", "подпись", "согласовал", "согласовала", "назначен", "назначена", "сотрудника", "менеджера",
    "позвони", "позвоните", "напиши", "напишите", "спросите", "уточни", "уточните", "попроси", "попросите",
    "скажи", "скажите", "напомни", "напомните", "передайте", "пригласи", "пригласите", "поблагодари", "добрый",
    "спасибо", "благодарю", "с уважением", "поздравляем", "отправь", "отправьте", "перешли", "перешлите",
]
SECRET = ["пароль", "токен", "ключ", "секрет", "доступ"]
EMAIL = ["почта", "email", "адрес"]
PHONE = ["телефон", "тел", "моб", "звонить"]
CARD = ["карта", "карты", "оплата"]
USER = ["пользователь", "логин", "учётка", "учетка"]

[keys]
SECRET = ["пароль", "токен", "секрет", "ключ"]
USER = ["логин", "пользователь"]
