<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From request to restored response</title>
<desc id="desc">A synthetic password becomes ANON_SECRET_1 before the LLM request. Kaponir restores the returned token using an encrypted local mapping. This is a workflow diagram, not a screenshot.</desc>
<rect width="1200" height="452" rx="20" fill="#0b1724"/>
<rect x="40" y="122" width="324" height="180" rx="16" fill="#17293b" stroke="#345069"/>
<rect x="438" y="122" width="324" height="180" rx="16" fill="#163b3b" stroke="#388a80"/>
<rect x="836" y="122" width="324" height="180" rx="16" fill="#17293b" stroke="#345069"/>
<path d="M 376 212 h 44 m -10 -7 l 10 7 l -10 7" fill="none" stroke="#91dbcd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 774 212 h 44 m -10 -7 l 10 7 l -10 7" fill="none" stroke="#91dbcd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="330" width="1120" height="66" rx="12" fill="#102131" stroke="#345069"/>
<rect x="61" y="354" width="18" height="17" rx="3" fill="none" stroke="#91dbcd" stroke-width="2"/><path d="M65 354v-5a5 5 0 0 1 10 0v5" fill="none" stroke="#91dbcd" stroke-width="2"/>
<text x="40" y="54" fill="#e8eef6" font-family="sans-serif" font-size="30" font-weight="700">From request to restored response</text>
<text x="40" y="86" fill="#a8b9cd" font-family="sans-serif" font-size="18" font-weight="400">One local policy. A reversible workflow.</text>
<text x="60" y="152" fill="#a8b9cd" font-family="sans-serif" font-size="13" font-weight="700">YOUR WORKSPACE</text>
<text x="60" y="185" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="600">Original text</text>
<text x="60" y="233" fill="#a8b9cd" font-family="monospace" font-size="18" font-weight="400">password:</text>
<text x="60" y="269" fill="#ffffff" font-family="monospace" font-size="23" font-weight="400">Cedar-47!Plum</text>
<text x="458" y="152" fill="#91dbcd" font-family="sans-serif" font-size="13" font-weight="700">LLM REQUEST</text>
<text x="458" y="185" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="600">Masked text</text>
<text x="458" y="233" fill="#a8b9cd" font-family="monospace" font-size="18" font-weight="400">password:</text>
<text x="458" y="269" fill="#91dbcd" font-family="monospace" font-size="23" font-weight="400">ANON_SECRET_1</text>
<text x="856" y="152" fill="#a8b9cd" font-family="sans-serif" font-size="13" font-weight="700">RESTORED RESPONSE</text>
<text x="856" y="185" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="600">Original value returns</text>
<text x="856" y="233" fill="#a8b9cd" font-family="monospace" font-size="18" font-weight="400">password:</text>
<text x="856" y="269" fill="#ffffff" font-family="monospace" font-size="23" font-weight="400">Cedar-47!Plum</text>
<text x="96" y="370" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="600">Encrypted local vault</text>
<text x="410" y="370" fill="#a8b9cd" font-family="sans-serif" font-size="18" font-weight="400">Mappings stay on your machine</text>
<text x="40" y="428" fill="#a8b9cd" font-family="sans-serif" font-size="14" font-weight="400">Illustrative example · synthetic data</text>
</svg>
