[package]
name = "kaponir-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kaponir-core = { version = "0.1.0", path = "../kaponir-core" }
kaponir-packs = { version = "0.1.0", path = "../kaponir-packs" }
kaponir-lang-ru = { version = "0.1.0", path = "../kaponir-lang-ru" }
kaponir-proxy = { version = "0.1.0", path = "../kaponir-proxy" }
kaponir-recognizers = { version = "0.1.0", path = "../kaponir-recognizers" }
kaponir-region-ru = { version = "0.1.0", path = "../kaponir-region-ru" }
kaponir-vault = { version = "0.1.0", path = "../kaponir-vault" }
kaponir-s1 = { version = "0.1.0", path = "../kaponir-s1" }
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }
toml = "1.1.8"
toml_edit = "0.25.17"

[[bin]]
name = "kaponir"
path = "src/main.rs"
