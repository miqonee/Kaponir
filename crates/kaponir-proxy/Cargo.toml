[package]
name = "kaponir-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kaponir-core = { version = "0.1.0", path = "../kaponir-core" }
kaponir-recognizers = { version = "0.1.0", path = "../kaponir-recognizers" }
kaponir-s1 = { version = "0.1.0", path = "../kaponir-s1" }
kaponir-vault = { version = "0.1.0", path = "../kaponir-vault" }
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
bytes = "1.12.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
kaponir-packs = { path = "../kaponir-packs" }
